openapi: 3.0.3
info:
  title: Moathon API
  version: 1.0.0
  description: 모아톤 서비스 API 문서
paths:
  /accounts/{user_pk}/follow/:
    post:
      operationId: accounts_follow_create
      parameters:
      - in: path
        name: user_pk
        schema:
          type: integer
        required: true
      tags:
      - accounts
      security:
      - tokenAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
  /accounts/badge_collection:
    get:
      operationId: accounts_badge_collection_retrieve
      summary: 뱃지 컬렉션 조회
      tags:
      - accounts
      security:
      - tokenAuth: []
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /accounts/find_password/:
    post:
      operationId: accounts_find_password_create
      summary: 비밀번호 재설정 메일 발송
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            examples:
              요청예시:
                value:
                  email: user@example.com
                summary: 요청 예시
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                응답예시:
                  value:
                    detail: 비밀번호 재설정 메일이 발송되었다면, 입력하신 이메일에서 확인하실 수 있습니다.
                  summary: 응답 예시
          description: ''
  /accounts/login/:
    post:
      operationId: accounts_login_create
      description: |-
        Check the credentials and return the REST Token
        if the credentials are valid and authenticated.
        Calls Django Auth login method to register User ID
        in Django session framework

        Accept the following POST parameters: username, password
        Return the REST Framework Token Object's key.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
          description: ''
  /accounts/logout/:
    post:
      operationId: accounts_logout_create
      description: |-
        Calls Django logout method and delete the Token object
        assigned to the current User object.

        Accepts/Returns nothing.
      tags:
      - accounts
      security:
      - tokenAuth: []
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestAuthDetail'
          description: ''
  /accounts/onboarding/:
    put:
      operationId: accounts_onboarding_update
      summary: 온보딩 최종 제출(PUT)
      tags:
      - Accounts
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
            examples:
              요청예시:
                value:
                  gender: M
                  credit_score: 850
                  assets: 12000000
                  salary: 3200000
                  average_monthly_spend: 1400000
                  tender: SAFE
                summary: 요청 예시
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                응답예시:
                  value:
                    onboarding_completed: true
                  summary: 응답 예시
          description: ''
  /accounts/password/change/:
    post:
      operationId: accounts_password_change_create
      description: |-
        Calls Django Auth SetPasswordForm save method.

        Accepts the following POST parameters: new_password1, new_password2
        Returns the success/fail message.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestAuthDetail'
          description: ''
  /accounts/password/reset/:
    post:
      operationId: accounts_password_reset_create
      description: |-
        Calls Django Auth PasswordResetForm save method.

        Accepts the following POST parameters: email
        Returns the success/fail message.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestAuthDetail'
          description: ''
  /accounts/password/reset/confirm/:
    post:
      operationId: accounts_password_reset_confirm_create
      description: |-
        Password reset e-mail link is confirmed, therefore
        this resets the user's password.

        Accepts the following POST parameters: token, uid,
            new_password1, new_password2
        Returns the success/fail message.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestAuthDetail'
          description: ''
  /accounts/profile/:
    get:
      operationId: accounts_profile_retrieve
      summary: 프로필 조회
      tags:
      - Accounts
      security:
      - tokenAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /accounts/profile/update/:
    patch:
      operationId: accounts_profile_update_partial_update
      summary: 프로필 수정(PATCH)
      tags:
      - Accounts
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /accounts/reset_password/:
    post:
      operationId: accounts_reset_password_create
      summary: 비밀번호 재설정
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
            examples:
              요청예시:
                value:
                  uid: Mg
                  token: set-password-token
                  new_password: NewPw!234
                  new_password2: NewPw!234
                summary: 요청 예시
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - tokenAuth: []
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                응답예시:
                  value:
                    detail: 비밀번호가 성공적으로 변경되었습니다.
                  summary: 응답 예시
          description: ''
  /accounts/signup/:
    post:
      operationId: accounts_signup_create
      description: |-
        Registers a new user.

        Accepts the following POST parameters: username, email, password1, password2.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomRegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomRegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomRegisterRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
          description: ''
  /accounts/signup/resend-email/:
    post:
      operationId: accounts_signup_resend_email_create
      description: |-
        Resends another email to an unverified email.

        Accepts the following POST parameter: email.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendEmailVerificationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResendEmailVerificationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResendEmailVerificationRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestAuthDetail'
          description: ''
  /accounts/signup/verify-email/:
    post:
      operationId: accounts_signup_verify_email_create
      description: |-
        Verifies the email associated with the provided key.

        Accepts the following POST parameter: key.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestAuthDetail'
          description: ''
  /accounts/user/:
    get:
      operationId: accounts_user_retrieve
      description: |-
        Reads and updates UserModel fields
        Accepts GET, PUT, PATCH methods.

        Default accepted fields: username, first_name, last_name
        Default display fields: pk, username, email, first_name, last_name
        Read-only fields: pk, email

        Returns UserModel fields.
      tags:
      - accounts
      security:
      - tokenAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetails'
          description: ''
    put:
      operationId: accounts_user_update
      description: |-
        Reads and updates UserModel fields
        Accepts GET, PUT, PATCH methods.

        Default accepted fields: username, first_name, last_name
        Default display fields: pk, username, email, first_name, last_name
        Read-only fields: pk, email

        Returns UserModel fields.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDetailsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserDetailsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserDetailsRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetails'
          description: ''
    patch:
      operationId: accounts_user_partial_update
      description: |-
        Reads and updates UserModel fields
        Accepts GET, PUT, PATCH methods.

        Default accepted fields: username, first_name, last_name
        Default display fields: pk, username, email, first_name, last_name
        Read-only fields: pk, email

        Returns UserModel fields.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserDetailsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserDetailsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserDetailsRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetails'
          description: ''
  /moathons/:
    get:
      operationId: moathons_retrieve
      tags:
      - moathons
      security:
      - tokenAuth: []
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /moathons/{moathon_pk}/:
    get:
      operationId: moathons_retrieve_2
      description: |-
        특정 모아톤의 상세 조회, 수정, 삭제 API
        - GET: 누구나 조회 가능 (로그인 유저)
        - PATCH/DELETE: 본인만 가능
        GET/PATCH/DELETE /moathon/<int:moathon_pk>/
      summary: 모아톤 상세 조회
      parameters:
      - in: path
        name: moathon_pk
        schema:
          type: integer
        required: true
      tags:
      - moathons
      security:
      - tokenAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoathonDetail'
          description: ''
    patch:
      operationId: moathons_partial_update
      description: |-
        특정 모아톤의 상세 조회, 수정, 삭제 API
        - GET: 누구나 조회 가능 (로그인 유저)
        - PATCH/DELETE: 본인만 가능
        GET/PATCH/DELETE /moathon/<int:moathon_pk>/
      summary: 모아톤 수정
      parameters:
      - in: path
        name: moathon_pk
        schema:
          type: integer
        required: true
      tags:
      - moathons
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMoathonUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMoathonUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMoathonUpdateRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoathonDetail'
          description: ''
    delete:
      operationId: moathons_destroy
      description: |-
        특정 모아톤의 상세 조회, 수정, 삭제 API
        - GET: 누구나 조회 가능 (로그인 유저)
        - PATCH/DELETE: 본인만 가능
        GET/PATCH/DELETE /moathon/<int:moathon_pk>/
      summary: 모아톤 삭제
      parameters:
      - in: path
        name: moathon_pk
        schema:
          type: integer
        required: true
      tags:
      - moathons
      security:
      - tokenAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /moathons/{moathon_pk}/comments/:
    get:
      operationId: moathons_comments_retrieve
      summary: 모아톤 댓글 목록 조회
      parameters:
      - in: path
        name: moathon_pk
        schema:
          type: integer
        required: true
      tags:
      - moathons
      security:
      - tokenAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoathonComment'
          description: ''
    post:
      operationId: moathons_comments_create
      summary: 모아톤 댓글 작성
      parameters:
      - in: path
        name: moathon_pk
        schema:
          type: integer
        required: true
      tags:
      - moathons
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoathonCommentWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MoathonCommentWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MoathonCommentWriteRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoathonComment'
          description: ''
  /moathons/{moathon_pk}/comments/{comment_pk}/:
    patch:
      operationId: moathons_comments_partial_update
      description: |-
        특정 모아톤 댓글의 수정/삭제 API
        - PATCH/DELETE: 본인만 가능
        PATCH/DELETE /moathon/<int:moathon_pk>/comments/<int:comment_pk>/
      summary: 모아톤 댓글 수정
      parameters:
      - in: path
        name: comment_pk
        schema:
          type: integer
        required: true
      - in: path
        name: moathon_pk
        schema:
          type: integer
        required: true
      tags:
      - moathons
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMoathonCommentWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMoathonCommentWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMoathonCommentWriteRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoathonComment'
          description: ''
    delete:
      operationId: moathons_comments_destroy
      description: |-
        특정 모아톤 댓글의 수정/삭제 API
        - PATCH/DELETE: 본인만 가능
        PATCH/DELETE /moathon/<int:moathon_pk>/comments/<int:comment_pk>/
      summary: 모아톤 댓글 삭제
      parameters:
      - in: path
        name: comment_pk
        schema:
          type: integer
        required: true
      - in: path
        name: moathon_pk
        schema:
          type: integer
        required: true
      tags:
      - moathons
      security:
      - tokenAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /moathons/{moathon_pk}/like/:
    post:
      operationId: moathons_like_create
      parameters:
      - in: path
        name: moathon_pk
        schema:
          type: integer
        required: true
      tags:
      - moathons
      security:
      - tokenAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
  /moathons/create/:
    post:
      operationId: moathons_create_create
      summary: 모아톤 생성
      tags:
      - moathons
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoathonCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MoathonCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MoathonCreateRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoathonDetail'
          description: ''
  /moathons/following/:
    get:
      operationId: moathons_following_retrieve
      description: 내가 팔로우하는 유저들의 '진행 중인' 모아톤 조회
      tags:
      - moathons
      security:
      - tokenAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
  /products/:
    get:
      operationId: products_retrieve
      description: |-
        전체 금융 상품 조회 API

        GET /products/
      parameters:
      - in: query
        name: bank
        schema:
          type: string
        description: '은행명 (예: 우리은행)'
      - in: query
        name: period
        schema:
          type: integer
        description: '예치 기간 (예: 12)'
      - in: query
        name: type
        schema:
          type: string
        description: '상품 유형 (예: DEPOSIT, SAVING)'
      tags:
      - products
      security:
      - tokenAuth: []
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /products/{product_id}/:
    get:
      operationId: products_retrieve_2
      description: |-
        금융 상품 상세 조회 API

        GET /products/<int:product_id>/
      parameters:
      - in: path
        name: product_id
        schema:
          type: integer
        required: true
      tags:
      - products
      security:
      - tokenAuth: []
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /products/banklist/:
    get:
      operationId: products_banklist_retrieve
      description: |-
        은행 목록 조회 API

        GET /banklist/
      summary: 은행 목록 조회
      tags:
      - products
      security:
      - tokenAuth: []
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /recommendations/recommend_product/:
    post:
      operationId: recommendations_recommend_product_create
      description: 사용자 목표/기간/성향을 입력받아 Stage1(XGB)로 Top-K 상품을 추린 뒤, Stage2(LLM)로 최종
        ProductOption 1개를 선택합니다.
      summary: 금융상품 추천 (Stage1 XGB + Stage2 LLM)
      tags:
      - Recommendations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationPreviewRequest'
            examples:
              요청예시:
                value:
                  target_amount: 10000000
                  start_amount: 2000000
                  term_months: 12
                  purpose: GOAL
                  top_k: 10
                  per_product_candidates: 3
                summary: 요청 예시
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RecommendationPreviewRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecommendationPreviewRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                응답예시(구조):
                  value:
                    final_recommendation:
                      product_id: 123
                      option_id: 456
                      reasons:
                      - '...'
                      warnings:
                      - '...'
                      used_fallback: false
                      option_detail:
                        option_id: 456
                        product_id: 123
                        product_name: 상품명
                        bank_name: 은행명
                        product_type: SAVING
                        join_deny: 1
                        max_limit: 100000000
                        save_trm: '12'
                        intr_rate: 3.2
                        intr_rate2: 3.8
                        rsrv_type_nm: 정액적립식
                        intr_rate_type_nm: 단리
                        spcl_cnd: 우대조건 ...
                        etc_note: 기타유의사항 ...
                        mtrt_int: 만기 후 이자율 ...
                    confirm_payload:
                      product_option_id: 456
                      target_amount: 10000000
                      start_amount: 2000000
                      term_months: 12
                      purpose: GOAL
                  summary: 응답 예시(구조)
          description: ''
  /visualizations/commodities/prices/:
    get:
      operationId: visualizations_commodities_prices_retrieve
      description: asset(gold/silver 등)를 기준으로 원자재 가격 시계열 데이터를 반환합니다. start/end를 둘
        다 주면 해당 기간만 필터링합니다.
      summary: 원자재 가격 시계열 조회
      parameters:
      - in: query
        name: asset
        schema:
          type: string
        description: '조회할 asset 코드 (예: gold, silver). 존재 여부는 서버에서 검증합니다.'
        required: true
      - in: query
        name: end
        schema:
          type: string
          format: date
        description: 종료일(YYYY-MM-DD). start와 함께 입력해야 합니다.
      - in: query
        name: start
        schema:
          type: string
          format: date
        description: 시작일(YYYY-MM-DD). end와 함께 입력해야 합니다.
      tags:
      - Visualizations
      security:
      - tokenAuth: []
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                응답예시(데이터있음):
                  value:
                    asset: gold
                    start: '2024-01-01'
                    end: '2024-12-31'
                    count: 2
                    data:
                    - date: '2024-01-02'
                      close_last: 2050.1
                      open: 2042.3
                      high: 2061.5
                      low: 2038.9
                      volume: 123456
                    - date: '2024-01-03'
                      close_last: 2060.4
                      open: 2051.0
                      high: 2068.2
                      low: 2047.7
                      volume: null
                  summary: 응답 예시(데이터 있음)
                응답예시(데이터없음):
                  value:
                    asset: gold
                    start: '2024-01-01'
                    end: '2024-01-02'
                    count: 0
                    message: 해당 기간에 해당하는 데이터가 없습니다.
                    data: []
                  summary: 응답 예시(데이터 없음)
                응답예시(400-파라미터오류):
                  value:
                    message: 요청 파라미터가 올바르지 않습니다.
                    errors:
                      end:
                      - 기간 선택 시 시작일과 종료일을 모두 입력해주세요.
                  summary: 응답 예시(400 - 파라미터 오류)
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
components:
  schemas:
    BlankEnum:
      enum:
      - ''
    CustomRegisterRequest:
      type: object
      description: |-
        dj-rest-auth 회원가입 시에
        - username, password1, password2, email (기본)
        + nickname, birth 를 추가로 받기 위한 Serializer
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
        password1:
          type: string
          writeOnly: true
          minLength: 1
        password2:
          type: string
          writeOnly: true
          minLength: 1
        nickname:
          type: string
          minLength: 1
          maxLength: 20
        birth:
          type: string
          format: date
      required:
      - birth
      - nickname
      - password1
      - password2
      - username
    GenderEnum:
      enum:
      - '0'
      - '1'
      type: string
      description: |-
        * `0` - 남성
        * `1` - 여성
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      required:
      - password
    MoathonComment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        moathon:
          type: integer
          readOnly: true
        content:
          type: string
          maxLength: 500
        nickname:
          type: string
          readOnly: true
        is_owner:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content
      - created_at
      - id
      - is_owner
      - moathon
      - nickname
      - updated_at
    MoathonCommentWriteRequest:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - content
    MoathonCreateRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 50
        target_amount:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        start_amount:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        purpose:
          $ref: '#/components/schemas/PurposeC6cEnum'
        product_option:
          type: integer
      required:
      - product_option
      - purpose
      - start_amount
      - target_amount
    MoathonDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 50
        purpose:
          $ref: '#/components/schemas/PurposeC6cEnum'
        progress_rate:
          type: string
          readOnly: true
        target_amount:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        product_option:
          allOf:
          - $ref: '#/components/schemas/ProductOptionSimple'
          readOnly: true
        user_info:
          type: string
          readOnly: true
        likes:
          type: string
          readOnly: true
        comments:
          type: array
          items:
            $ref: '#/components/schemas/MoathonComment'
          readOnly: true
      required:
      - comments
      - end_date
      - id
      - likes
      - product_option
      - progress_rate
      - purpose
      - target_amount
      - user_info
    NullEnum:
      enum:
      - null
    OnboardingRequest:
      type: object
      properties:
        profile_image:
          type: string
          format: binary
          nullable: true
        gender:
          oneOf:
          - $ref: '#/components/schemas/GenderEnum'
          - $ref: '#/components/schemas/BlankEnum'
        credit_score:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        assets:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        salary:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        average_monthly_spend:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        tender:
          oneOf:
          - $ref: '#/components/schemas/TenderEnum'
          - $ref: '#/components/schemas/BlankEnum'
      required:
      - assets
      - average_monthly_spend
      - credit_score
      - gender
      - salary
      - tender
    PasswordChangeRequest:
      type: object
      properties:
        new_password1:
          type: string
          minLength: 1
          maxLength: 128
        new_password2:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - new_password1
      - new_password2
    PasswordResetConfirmRequest:
      type: object
      description: Serializer for confirming a password reset attempt.
      properties:
        new_password1:
          type: string
          minLength: 1
          maxLength: 128
        new_password2:
          type: string
          minLength: 1
          maxLength: 128
        uid:
          type: string
          minLength: 1
        token:
          type: string
          minLength: 1
      required:
      - new_password1
      - new_password2
      - token
      - uid
    PasswordResetRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    PatchedMoathonCommentWriteRequest:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 500
    PatchedMoathonUpdateRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 50
        target_amount:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        purpose:
          $ref: '#/components/schemas/PurposeC6cEnum'
    PatchedProfileUpdateRequest:
      type: object
      properties:
        profile_image:
          type: string
          format: binary
          nullable: true
        gender:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/GenderEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        credit_score:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        assets:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        salary:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        average_monthly_spend:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        tender:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/TenderEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
    PatchedUserDetailsRequest:
      type: object
      description: User model w/o password
      properties:
        username:
          type: string
          minLength: 1
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
    ProductOptionSimple:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product_name:
          type: string
          readOnly: true
        bank_name:
          type: string
          readOnly: true
        product_type:
          type: string
          readOnly: true
        product_id:
          type: integer
          readOnly: true
      required:
      - bank_name
      - id
      - product_id
      - product_name
      - product_type
    PurposeC6cEnum:
      enum:
      - GOAL
      - SHORT
      - SAFE
      - HABIT
      - YIELD
      type: string
      description: |-
        * `GOAL` - 목돈 마련
        * `SHORT` - 단기 여유자금
        * `SAFE` - 안정적 자산 보관
        * `HABIT` - 저축 습관 형성
        * `YIELD` - 이자 극대화
    RecommendationPreviewPurposeEnum:
      enum:
      - GOAL
      - SHORT
      - SAFE
      - HABIT
      - YIELD
      type: string
      description: |-
        * `GOAL` - GOAL
        * `SHORT` - SHORT
        * `SAFE` - SAFE
        * `HABIT` - HABIT
        * `YIELD` - YIELD
    RecommendationPreviewRequest:
      type: object
      properties:
        target_amount:
          type: integer
          minimum: 0
        start_amount:
          type: integer
          minimum: 0
        term_months:
          type: integer
          maximum: 120
          minimum: 1
        purpose:
          $ref: '#/components/schemas/RecommendationPreviewPurposeEnum'
        top_k:
          type: integer
          maximum: 50
          minimum: 1
          default: 10
        per_product_candidates:
          type: integer
          maximum: 7
          minimum: 1
          default: 3
      required:
      - purpose
      - start_amount
      - target_amount
      - term_months
    ResendEmailVerificationRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
    RestAuthDetail:
      type: object
      properties:
        detail:
          type: string
          readOnly: true
      required:
      - detail
    TenderEnum:
      enum:
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      type: string
      description: |-
        * `1` - 매우보수적
        * `2` - 보수적
        * `3` - 보통
        * `4` - 공격적
        * `5` - 매우공격적
    Token:
      type: object
      description: Serializer for Token model.
      properties:
        key:
          type: string
          maxLength: 40
      required:
      - key
    UserDetails:
      type: object
      description: User model w/o password
      properties:
        pk:
          type: integer
          readOnly: true
          title: ID
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
      required:
      - email
      - pk
      - username
    UserDetailsRequest:
      type: object
      description: User model w/o password
      properties:
        username:
          type: string
          minLength: 1
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
      required:
      - username
    VerifyEmailRequest:
      type: object
      properties:
        key:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - key
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
