name: "⚙️ TASK"
description: "기타 단순 작업 (CI/CD, 라이브러리 업데이트 등)"
title: "[TASK] "
labels: ["chore"]
body:
  - type: textarea
    id: description
    attributes:
      label: "작업 상세 내용"
      description: "어떤 작업이 필요한지 설명해주세요."
      placeholder: "예: 'requirements.txt의 'django' 라이브러리 최신 버전으로 업데이트'"
    validations:
      required: true
  - type: textarea
    id: todo
    attributes:
      label: "📝 Todo"
      placeholder: |
        - [ ] 작업 진행
        - [ ] 테스트