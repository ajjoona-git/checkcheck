name: "🐞BUG"
description: "버그 리포트 템플릿"
title: "[BUG] "
labels: ["fix"]
body:
  - type: markdown
    attributes:
      value: "버그 리포트를 작성해주셔서 감사합니다. 아래 양식에 맞춰 상세히 작성해주세요."
  - type: textarea
    id: description
    attributes:
      label: "버그 설명"
      description: "어떤 버그인지 명확하게 설명해주세요."
      placeholder: "예: '로그인 버튼 클릭 시 500 에러가 발생합니다.'"
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: "재현 단계"
      description: "버그를 재현할 수 있는 단계를 순서대로 작성해주세요."
      placeholder: |
        1. '...' 페이지로 이동
        2. '...' 버튼 클릭
        3. '...' 에러 확인
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: "예상 결과"
      description: "정상적으로 동작했을 때의 결과를 작성해주세요."
      placeholder: "예: '로그인이 성공하고 메인 페이지로 이동합니다.'"
  - type: textarea
    id: actual-behavior
    attributes:
      label: "실제 결과 (스크린샷/로그)"
      description: "현재 발생하는 오류와, 가능하다면 스크린샷이나 콘솔 로그를 첨부해주세요."
  - type: textarea
    id: todo
    attributes:
      label: "📝 Todo"
      description: "해결을 위해 필요한 작업 목록을 작성해주세요."
      placeholder: |
        - [ ] 원인 분석
        - [ ] 코드 수정
        - [ ] 테스트 코드 작성
  - type: input
    id: related-issues
    attributes:
      label: "🔗 관련 이슈"
      description: "관련된 이슈가 있다면 링크를 남겨주세요."
      placeholder: "예: #1, #2"