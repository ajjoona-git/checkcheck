name: "📚 DOCS"
description: "문서 추가 또는 수정"
title: "[DOCS] "
labels: ["docs"]
body:
  - type: dropdown
    id: doc-type
    attributes:
      label: "문서 작업 유형"
      options:
        - 새로운 문서 작성
        - 기존 문서 수정 (오타, 내용 보강)
        - 문서 번역
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "작업 상세 내용"
      description: "어떤 문서를 어떻게 추가/수정할 것인지 설명해주세요."
    validations:
      required: true
  - type: textarea
    id: todo
    attributes:
      label: "📝 Todo"
      placeholder: |
        - [ ] 초안 작성
        - [ ] 리뷰
        - [ ] 반영
  - type: input
    id: related-issues
    attributes:
      label: "🔗 관련 이슈"